<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="#{todo.list.title}">Todo list</title>
</head>
<body>
<h1 th:text="#{todo.list.title}">Todo list</h1>

<p>
  <a th:href="@{/(lang='vi')}">VI</a> |
  <a th:href="@{/(lang='en')}">EN</a>
</p>

<p th:text="#{owner.listHeader(${ownerName})}">Owner list header</p>

<p th:if="${message}" th:text="#{${message}}" style="color: green;"></p>

<a th:href="@{/todos/new}" th:text="#{todo.list.addNew}">Add new todo</a>

<table border="1" cellpadding="8" cellspacing="0">
  <thead>
  <tr>
    <th>ID</th>
    <th th:text="#{todo.field.content}">Content</th>
    <th th:text="#{todo.field.dueDate}">Due date</th>
    <th th:text="#{todo.field.status}">Status</th>
    <th th:text="#{todo.field.priority}">Priority</th>
    <th th:text="#{todo.field.actions}">Actions</th>
  </tr>
  </thead>
  <tbody>
  <tr th:if="${#lists.isEmpty(todos)}">
    <td colspan="6" th:text="#{todo.list.empty}">No todos</td>
  </tr>
  <tr th:each="todo : ${todos}">
    <td th:text="${todo.id}"></td>
    <td th:text="${todo.content}"></td>
    <td th:text="${todo.dueDate}"></td>
    <td th:text="#{${'todo.status.' + todo.status.name()}}"></td>
    <td th:text="#{${'todo.priority.' + todo.priority.name()}}"></td>
    <td>
      <a th:href="@{/todos/edit/{id}(id=${todo.id})}" th:text="#{todo.action.edit}">Edit</a>
      |
      <a th:href="@{/todos/delete/{id}(id=${todo.id})}"
         th:onclick="|return confirm('${#messages.msg('todo.confirm.delete')}')|"
         th:text="#{todo.action.delete}">Delete</a>
    </td>
  </tr>
  </tbody>
</table>
</body>
</html>
